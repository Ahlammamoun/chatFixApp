security:
    password_hashers:
        App\Entity\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # ✅ ADMIN WEB (session + form_login)
        admin:
            pattern: ^/(admin|login|logout)
            provider: app_user_provider
            lazy: true
            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: email
                password_parameter: password
            logout:
                path: app_logout
                target: app_login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /

        # ✅ LOGIN API (JWT) -> /api/login
        api_login:
            pattern: ^/api/login
            stateless: true
            json_login:
                check_path: /api/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # ✅ API protégée (JWT)
        api:
            pattern: ^/api
            stateless: true
            jwt: ~


    access_control:
    # admin
    - { path: ^/admin, roles: ROLE_ADMIN }
    - { path: ^/login, roles: PUBLIC_ACCESS }
    - { path: ^/logout, roles: PUBLIC_ACCESS }

    # public api
    - { path: ^/api/stripe/webhook$, roles: PUBLIC_ACCESS }
    - { path: ^/api/register, roles: PUBLIC_ACCESS }
    - { path: ^/api/professionals, roles: PUBLIC_ACCESS }
    - { path: ^/api/specialities, roles: PUBLIC_ACCESS }
    - { path: ^/api/login, roles: PUBLIC_ACCESS }

    # le reste de l'API = JWT obligatoire
    - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }


